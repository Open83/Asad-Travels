<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Details Form</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --text-dark: #111827;
            --text-gray: #4b5563;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: #f3f4f6;
            margin: 0;
            padding: 10px;
        }

        /* --- UI Controls (Hide in PDF) --- */
        .controls-area {
            max-width: 794px;
            margin: 0 auto 15px auto;
            text-align: right;
        }

        /* --- DOCUMENT CONTAINER (A4 Tight Layout) --- */
        .a4-container {
            max-width: 794px;
            background: #ffffff;
            padding: 25px 35px; /* Tighter padding */
            margin: 0 auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* --- FORM STYLING --- */
        h2 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 10px 0; /* Removed top margin */
            font-size: 1.4rem;
            color: var(--text-dark);
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
        }

        .header-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px; /* Reduced from 20px */
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .section-title {
            background: #f0f0f0;
            padding: 4px 8px; /* Compact padding */
            font-weight: 700;
            font-size: 0.9rem;
            margin-top: 15px; /* Reduced space */
            margin-bottom: 10px;
            border-left: 4px solid var(--primary);
            text-transform: uppercase;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 8px; /* Reduced from 15px */
        }

        label {
            display: block;
            font-size: 0.75rem; /* Smaller labels */
            color: #666;
            margin-bottom: 2px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* CLEAN INPUT STYLE */
        input, textarea, select {
            width: 100%;
            border: none;
            border-bottom: 1px solid #999;
            border-radius: 0;
            padding: 4px 0;
            font-size: 0.95rem;
            font-weight: 500;
            color: #000;
            background: transparent;
            outline: none;
        }

        /* --- EXPENSES TABLE --- */
        .expense-header {
            display: flex;
            font-size: 0.75rem;
            font-weight: bold;
            border-bottom: 2px solid #000;
            padding-bottom: 2px;
            margin-bottom: 8px;
        }
        
        .expense-row {
            display: flex;
            gap: 15px;
            margin-bottom: 5px;
            align-items: center;
        }

        /* --- SIGNATURE AREA (Compact) --- */
        .signature-section {
            margin-top: 20px;
            page-break-inside: avoid;
        }

        .signature-box {
            border: 1px solid #ccc;
            height: 100px; /* Reduced height to fit page */
            width: 100%;
            border-radius: 4px;
            background: #fff;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- BUTTONS --- */
        .btn { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-weight: 600; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: #ef4444; color: white; padding: 4px 8px; font-size: 0.8rem; }
        .btn-add { background: #fff; border: 1px dashed #999; width: 100%; margin-top: 5px; color: #555; padding: 6px; }
        .btn-download { background: #10b981; color: white; padding: 12px 24px; font-size: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        /* Mobile */
        @media (max-width: 600px) {
            .a4-container { padding: 15px; }
            .grid-2 { grid-template-columns: 1fr; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="controls-area">
        <button class="btn btn-download" onclick="generatePDF()">
            <i class="fas fa-file-pdf"></i> Download PDF
        </button>
    </div>

    <div class="a4-container" id="printable-form">
        
        <h2>Journey Log Sheet</h2>
        
        <div class="header-meta">
            <div><strong>Date:</strong> <span id="currentDate"></span></div>
            <div style="text-align: right;">
                <label style="display:inline; margin-right:5px;">ID:</label>
                <input type="text" id="bookingId" readonly style="width: 150px; display:inline-block; text-align:right; font-weight:bold; border:none;">
            </div>
        </div>

        <div class="section-title" style="margin-top: 5px;">Customer Details</div>
        <div class="grid-2">
            <div class="form-group">
                <label>Customer Name</label>
                <input type="text" id="custName" placeholder="Name">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="custPhone" placeholder="Phone">
            </div>
        </div>

        <div class="section-title">Journey Details</div>
        <div class="grid-2">
            <div class="form-group">
                <label>Start Time</label>
                <input type="datetime-local" id="startTime">
            </div>
            <div class="form-group">
                <label>End Time</label>
                <input type="datetime-local" id="endTime">
            </div>
        </div>
        <div class="grid-2" style="margin-top: 8px;">
            <div class="form-group">
                <label>Start KM</label>
                <input type="number" id="startKm" placeholder="0">
            </div>
            <div class="form-group">
                <label>End KM</label>
                <input type="number" id="endKm" placeholder="0">
            </div>
        </div>

        <div class="section-title">Expenses</div>
        <div class="expense-header">
            <div style="flex: 2;">Description</div>
            <div style="flex: 1;">Amount (₹)</div>
            <div style="width: 30px;"></div>
        </div>
        
        <div id="expense-container"></div>

        <button class="btn btn-add" onclick="addExpenseRow()" data-html2canvas-ignore="true">
            <i class="fas fa-plus"></i> Add Expense
        </button>

        <div class="section-title">Remarks</div>
        <div class="form-group">
            <textarea id="remarks" rows="2" placeholder="Notes..."></textarea>
        </div>

        <div class="signature-section">
            <label>Signature</label>
            <div class="signature-box">
                <canvas id="sig-canvas"></canvas>
            </div>
            <div style="text-align: right; margin-top: 5px;" data-html2canvas-ignore="true">
                <button class="btn btn-danger" id="clear-sig">Clear</button>
            </div>
        </div>

        <div style="margin-top: 20px; text-align: center; font-size: 0.7rem; color: #aaa;">
            Generated via Web App
        </div>

    </div>

    <script>
        window.onload = function() {
            const today = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
            document.getElementById('currentDate').textContent = today;
            
            const randomPart = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('bookingId').value = `AST-${randomPart}`;

            addExpenseRow(); // Add first row
            setupCanvas();
        };

        function addExpenseRow() {
            const container = document.getElementById('expense-container');
            const row = document.createElement('div');
            row.className = 'expense-row';
            row.innerHTML = `
                <input type="text" placeholder="Detail" style="flex: 2;">
                <input type="number" placeholder="0" style="flex: 1;">
                <button class="btn btn-danger" onclick="this.parentElement.remove()" data-html2canvas-ignore="true" style="width:30px;">
                    <i class="fas fa-times"></i>
                </button>
            `;
            container.appendChild(row);
        }

        // --- Signature Logic ---
        let canvas, ctx, writingMode = false;

        function setupCanvas() {
            canvas = document.getElementById("sig-canvas");
            ctx = canvas.getContext("2d");
            
            // Wait for layout to settle before sizing
            setTimeout(() => {
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
            }, 100);

            const events = [
                ['mousedown', 'mouseup', 'mousemove'], 
                ['touchstart', 'touchend', 'touchmove']
            ];

            events[0].forEach(e => canvas.addEventListener(e, handleMouse, {passive: false}));
            events[1].forEach(e => canvas.addEventListener(e, handleTouch, {passive: false}));
        }

        function handleMouse(e) {
            if(e.type === 'mousedown') { writingMode = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); }
            else if(e.type === 'mouseup') { writingMode = false; }
            else if(writingMode) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); }
        }

        function handleTouch(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left;
            const y = e.touches[0].clientY - rect.top;

            if(e.type === 'touchstart') { writingMode = true; ctx.beginPath(); ctx.moveTo(x, y); }
            else if(e.type === 'touchend') { writingMode = false; }
            else if(writingMode) { ctx.lineTo(x, y); ctx.stroke(); }
        }

        document.getElementById('clear-sig').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // --- PDF Logic ---
        function generatePDF() {
            const element = document.getElementById('printable-form');
            const id = document.getElementById('bookingId').value;

            const opt = {
                margin:       [0, 0, 0, 0], // No outer margins
                filename:     `Booking_${id}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
