<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Details Form</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --text-dark: #111827;
            --text-gray: #4b5563;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
        }

        /* --- UI ONLY (Web View) --- */
        .controls-area {
            max-width: 750px;
            margin: 0 auto 20px auto;
            text-align: right;
        }

        /* --- DOCUMENT CONTAINER (The A4 Sheet) --- */
        .a4-container {
            max-width: 794px; /* A4 width in pixels approx */
            min-height: 1123px; /* A4 height */
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        /* --- FORM STYLING --- */
        h2 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-size: 1.5rem;
            color: var(--text-dark);
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }

        .header-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .section-title {
            background: #f0f0f0;
            padding: 5px 10px;
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
            text-transform: uppercase;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px; /* Space between columns */
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* THE "LINE" INPUT STYLE */
        input, textarea, select {
            width: 100%;
            border: none;
            border-bottom: 1px solid #999; /* The Line */
            border-radius: 0;
            padding: 5px 0;
            font-size: 1rem;
            font-weight: 500;
            color: #000;
            background: transparent;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-bottom: 2px solid var(--primary);
        }

        /* --- EXPENSES TABLE --- */
        .expense-header {
            display: flex;
            font-size: 0.8rem;
            font-weight: bold;
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        
        .expense-row {
            display: flex;
            gap: 15px;
            margin-bottom: 8px;
            align-items: center;
        }

        /* --- SIGNATURE AREA --- */
        .signature-section {
            margin-top: 30px;
            page-break-inside: avoid; /* Prevent splitting in PDF */
        }

        .signature-box {
            border: 1px solid #ccc;
            height: 120px;
            width: 100%;
            border-radius: 4px;
            position: relative;
            background: #fff;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        /* --- BUTTONS --- */
        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: #ef4444; color: white; padding: 4px 10px; font-size: 0.8rem; }
        .btn-add { background: #fff; border: 1px dashed #999; width: 100%; margin-top: 5px; color: #555; }
        .btn-download { background: #10b981; color: white; padding: 12px 24px; font-size: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        /* --- HELPER TO HIDE ELEMENTS IN PDF --- */
        .no-print {
            /* This class will be hidden by the data-html2canvas-ignore attribute logic */
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .a4-container { padding: 20px; height: auto; }
            .grid-2 { grid-template-columns: 1fr; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="controls-area">
        <button class="btn btn-download" onclick="generatePDF()">
            <i class="fas fa-file-pdf"></i> Download PDF
        </button>
    </div>

    <div class="a4-container" id="printable-form">
        
        <h2>Journey Log Sheet</h2>
        
        <div class="header-meta">
            <div><strong>Date:</strong> <span id="currentDate"></span></div>
            <div style="text-align: right;">
                <label style="display:inline; margin-right:5px;">Booking ID:</label>
                <input type="text" id="bookingId" readonly style="width: 180px; display:inline-block; text-align:right; font-weight:bold;">
            </div>
        </div>

        <div class="section-title">Customer Details</div>
        <div class="grid-2">
            <div class="form-group">
                <label>Customer Name</label>
                <input type="text" id="custName" placeholder="Enter name">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="custPhone" placeholder="Enter phone">
            </div>
        </div>

        <div class="section-title">Journey Details</div>
        <div class="grid-2">
            <div class="form-group">
                <label>Start Date & Time</label>
                <input type="datetime-local" id="startTime">
            </div>
            <div class="form-group">
                <label>End Date & Time</label>
                <input type="datetime-local" id="endTime">
            </div>
        </div>
        <div class="grid-2" style="margin-top: 15px;">
            <div class="form-group">
                <label>Start KM Reading</label>
                <input type="number" id="startKm" placeholder="0">
            </div>
            <div class="form-group">
                <label>End KM Reading</label>
                <input type="number" id="endKm" placeholder="0">
            </div>
        </div>

        <div class="section-title">Trip Expenses</div>
        <div class="expense-header">
            <div style="flex: 2;">Description</div>
            <div style="flex: 1;">Amount (₹)</div>
            <div style="width: 40px;" class="no-print"></div>
        </div>
        
        <div id="expense-container">
            </div>

        <button class="btn btn-add" onclick="addExpenseRow()" data-html2canvas-ignore="true">
            <i class="fas fa-plus"></i> Add Another Expense
        </button>

        <div class="section-title">Remarks</div>
        <div class="form-group">
            <textarea id="remarks" rows="2" placeholder="Notes regarding toll, parking, or vehicle condition..."></textarea>
        </div>

        <div class="signature-section">
            <label>Driver / Customer Signature</label>
            <div class="signature-box">
                <canvas id="sig-canvas"></canvas>
            </div>
            <div style="text-align: right; margin-top: 5px;" data-html2canvas-ignore="true">
                <button class="btn btn-danger" id="clear-sig">Clear Signature</button>
            </div>
        </div>

        <div style="margin-top: 30px; text-align: center; font-size: 0.7rem; color: #999; border-top: 1px solid #ddd; padding-top: 10px;">
            This is a computer-generated document.
        </div>

    </div>

    <script>
        // --- 1. Initialization ---
        window.onload = function() {
            // Set Date
            const today = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('currentDate').textContent = today;

            // Generate ID
            const randomPart = Math.floor(10000 + Math.random() * 90000);
            const bookingId = `AST-${randomPart}`;
            document.getElementById('bookingId').value = bookingId;

            // Add first expense row
            addExpenseRow();

            // Setup Canvas
            setupCanvas();
        };

        // --- 2. Expense Logic ---
        function addExpenseRow() {
            const container = document.getElementById('expense-container');
            const row = document.createElement('div');
            row.className = 'expense-row';
            row.innerHTML = `
                <input type="text" placeholder="e.g. Fuel / Toll" style="flex: 2;">
                <input type="number" placeholder="0.00" style="flex: 1;">
                <button class="btn btn-danger no-print" onclick="this.parentElement.remove()" data-html2canvas-ignore="true">
                    <i class="fas fa-times"></i>
                </button>
            `;
            container.appendChild(row);
        }

        // --- 3. Robust Signature Logic (Mobile + Desktop) ---
        let canvas, ctx, writingMode = false;

        function setupCanvas() {
            canvas = document.getElementById("sig-canvas");
            ctx = canvas.getContext("2d");
            
            // Set actual canvas size to match display size for sharpness
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000000';

            // Events
            ['mousedown', 'touchstart'].forEach(evt => 
                canvas.addEventListener(evt, startDrawing, {passive: false}));
            ['mouseup', 'touchend'].forEach(evt => 
                canvas.addEventListener(evt, stopDrawing, {passive: false}));
            ['mousemove', 'touchmove'].forEach(evt => 
                canvas.addEventListener(evt, draw, {passive: false}));
        }

        function startDrawing(e) {
            writingMode = true;
            ctx.beginPath();
            const [x, y] = getPos(e);
            ctx.moveTo(x, y);
            e.preventDefault();
        }

        function stopDrawing(e) {
            writingMode = false;
        }

        function draw(e) {
            if (!writingMode) return;
            const [x, y] = getPos(e);
            ctx.lineTo(x, y);
            ctx.stroke();
            e.preventDefault();
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return [clientX - rect.left, clientY - rect.top];
        }

        document.getElementById('clear-sig').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // --- 4. PDF Generation (Optimized for Single Page) ---
        function generatePDF() {
            const element = document.getElementById('printable-form');
            const id = document.getElementById('bookingId').value;
            
            // Temporarily tighten margins specifically for the print action
            element.style.padding = "20px"; 

            const opt = {
                margin:       [5, 5, 5, 5], // Very slim margins to fit content
                filename:     `Booking_${id}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: 'avoid-all' } // Tries to keep everything on one page
            };

            html2pdf().set(opt).from(element).save().then(() => {
                // Restore padding after download
                element.style.padding = "40px";
            });
        }
    </script>
</body>
</html>
