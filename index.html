<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duty Slip</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --border-color: #e5e7eb;
            --bg-color: #f3f4f6;
            --paper-width: 794px; /* A4 Width */
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
            display: flex;
            justify-content: center;
        }

        .page-container {
            width: 100%;
            max-width: var(--paper-width);
            background: #ffffff;
            min-height: auto; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .doc-header {
            background: var(--primary);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .doc-title {
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }

        .doc-meta {
            text-align: right;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .meta-row {
            margin-bottom: 4px;
        }
        
        .id-badge {
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            margin-left: 5px;
        }

        .doc-body {
            padding: 25px 30px;
        }

        .section {
            margin-bottom: 20px; /* Slightly increased spacing for cleaner look */
        }

        .section-header {
            display: flex;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
        }
        
        .section-header i { margin-right: 8px; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group {
            margin-bottom: 5px;
        }

        label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-light);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 2px;
        }

        input, select, textarea {
            width: 100%;
            border: 1px solid transparent;
            border-bottom: 1px solid #d1d5db;
            background: transparent;
            font-size: 0.95rem;
            color: var(--text-dark);
            font-weight: 500;
            padding: 6px 0;
            border-radius: 0;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            border-bottom-color: var(--primary);
        }
        
        input::placeholder { color: #ccc; font-weight: 400; }

        .signature-area {
            margin-top: 30px;
            page-break-inside: avoid; 
            break-inside: avoid;
            -webkit-column-break-inside: avoid;
        }

        .canvas-wrapper {
            border: 2px dashed #e5e7eb;
            border-radius: 8px;
            background: #fff;
            height: 110px;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .clear-sig-btn {
            font-size: 0.75rem;
            color: #ef4444;
            background: none;
            border: none;
            text-decoration: underline;
            cursor: pointer;
            float: right;
            margin-top: 5px;
        }

        .floating-actions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            gap: 10px;
        }

        .hidden-in-pdf {
            display: inline-flex !important;
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-new-booking {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-download:active, .btn-new-booking:active { 
            transform: scale(0.98); 
        }

        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #10b981;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            display: none;
        }

        .status-badge.active {
            display: block;
        }

        @media (max-width: 600px) {
            .page-container { width: 100%; box-shadow: none; }
            .doc-header { padding: 20px; flex-direction: column; align-items: flex-start; gap: 10px; }
            .doc-meta { text-align: left; }
            .doc-body { padding: 20px; }
            .grid-2 { grid-template-columns: 1fr; gap: 15px; }
            .floating-actions { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="page-container" id="printable-area">
        
        <div class="status-badge" id="statusBadge">
            <i class="fas fa-check-circle"></i> Data Restored
        </div>

        <div class="doc-header">
            <h1 class="doc-title">Duty Slip</h1>
            <div class="doc-meta">
                <div class="meta-row">Date: <span id="displayDate" style="font-weight:600"></span></div>
                <div class="meta-row">ID: <span id="bookingId" class="id-badge">...</span></div>
            </div>
        </div>

        <div class="doc-body">
            
            <div class="section">
                <div class="section-header"><i class="fas fa-user"></i> Customer Details</div>
                <div class="grid-2">
                    <div class="input-group">
                        <label>Customer Name</label>
                        <input type="text" id="custName" placeholder="Enter full name">
                    </div>
                    <div class="input-group">
                        <label>Phone Number</label>
                        <input type="tel" id="custPhone" placeholder="Enter phone number">
                    </div>
                </div>
                <div class="input-group" style="margin-top: 15px;">
                    <label>Address</label>
                    <input type="text" id="custAddress" placeholder="Enter full address">
                </div>
            </div>

            <div class="section">
                <div class="section-header"><i class="fas fa-route"></i> Journey Details</div>
                <div class="grid-2">
                    <div class="input-group">
                        <label>Start Time</label>
                        <input type="datetime-local" id="startTime">
                    </div>
                    <div class="input-group">
                        <label>End Time</label>
                        <input type="datetime-local" id="endTime">
                    </div>
                </div>
                <div class="grid-2" style="margin-top: 15px;">
                    <div class="input-group">
                        <label>Start KM Reading</label>
                        <input type="number" id="startKm" placeholder="0">
                    </div>
                    <div class="input-group">
                        <label>End KM Reading</label>
                        <input type="number" id="endKm" placeholder="0">
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-header"><i class="fas fa-clipboard-list"></i> Customer Uses</div>
                <div class="grid-2">
                    <div class="input-group">
                        <label>Reading Km</label>
                        <input type="number" id="useReadingKm" placeholder="0">
                    </div>
                    <div class="input-group">
                        <label>Closing Time</label>
                        <input type="time" id="useClosingTime">
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-header"><i class="fas fa-comment-alt"></i> Remarks</div>
                <textarea id="remarks" rows="2" placeholder="Any additional notes about the trip..."></textarea>
            </div>

            <div class="signature-area">
                <label style="margin-bottom: 8px; display:block;">Driver / Customer Signature</label>
                <div class="canvas-wrapper">
                    <canvas id="sig-canvas"></canvas>
                </div>
                <button class="clear-sig-btn hidden-in-pdf" id="clear-sig" data-html2canvas-ignore="true">
                    Clear Signature
                </button>
            </div>

        </div>
        
        <div style="text-align: center; font-size: 0.7rem; color: #9ca3af; padding-bottom: 20px; margin-top: 10px;">
            System Generated Invoice • Valid without physical seal
        </div>

    </div>

    <div class="floating-actions">
        <button class="btn-new-booking" onclick="startNewBooking()">
            <i class="fas fa-plus"></i> New Booking
        </button>
        <button class="btn-download" onclick="generatePDF()">
            <i class="fas fa-file-pdf"></i> Download PDF
        </button>
    </div>

    <script>
        // ============================================
        // PERSISTENT STORAGE SYSTEM
        // ============================================
        
        const STORAGE_KEY = 'dutySlipData_v2'; // Changed key to avoid conflict with old data
        let canvas, ctx, writingMode = false;
        let autoSaveTimeout;

        // --- INITIALIZATION ---
        window.onload = function() {
            setupCanvas();
            
            // Try to restore existing booking, or create new one
            const savedData = loadBookingData();
            
            if (savedData) {
                restoreBookingData(savedData);
                showRestoreNotification();
            } else {
                createNewBooking();
            }
            
            // Setup auto-save on any input change
            setupAutoSave();
        };

        // --- CREATE NEW BOOKING ---
        function createNewBooking() {
            const today = new Date().toLocaleDateString('en-IN', { 
                day: 'numeric', 
                month: 'short', 
                year: 'numeric' 
            });
            document.getElementById('displayDate').textContent = today;
            
            const randomId = Math.floor(1000 + Math.random() * 9000);
            const bookingId = `AST-${randomId}`;
            document.getElementById('bookingId').textContent = bookingId;
            
            // Save initial state
            saveBookingData();
        }

        // --- START NEW BOOKING (Clear Everything) ---
        function startNewBooking() {
            if (confirm('Are you sure you want to start a new booking? Current data will be cleared.')) {
                // Clear localStorage
                localStorage.removeItem(STORAGE_KEY);
                
                // Clear canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Clear all inputs
                document.getElementById('custName').value = '';
                document.getElementById('custPhone').value = '';
                document.getElementById('custAddress').value = ''; // Clear Address
                document.getElementById('startTime').value = '';
                document.getElementById('endTime').value = '';
                document.getElementById('startKm').value = '';
                document.getElementById('endKm').value = '';
                document.getElementById('useReadingKm').value = ''; // Clear Reading Km
                document.getElementById('useClosingTime').value = ''; // Clear Closing Time
                document.getElementById('remarks').value = '';
                
                // Create new booking
                createNewBooking();
                
                alert('New booking created!');
            }
        }

        // --- SAVE DATA TO LOCALSTORAGE ---
        function saveBookingData() {
            const data = {
                bookingId: document.getElementById('bookingId').textContent,
                date: document.getElementById('displayDate').textContent,
                custName: document.getElementById('custName').value,
                custPhone: document.getElementById('custPhone').value,
                custAddress: document.getElementById('custAddress').value, // Save Address
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                startKm: document.getElementById('startKm').value,
                endKm: document.getElementById('endKm').value,
                useReadingKm: document.getElementById('useReadingKm').value, // Save Reading Km
                useClosingTime: document.getElementById('useClosingTime').value, // Save Closing Time
                remarks: document.getElementById('remarks').value,
                signature: canvas.toDataURL(), // Save signature as image
                timestamp: new Date().toISOString()
            };
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        // --- LOAD DATA FROM LOCALSTORAGE ---
        function loadBookingData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            return saved ? JSON.parse(saved) : null;
        }

        // --- RESTORE SAVED DATA ---
        function restoreBookingData(data) {
            document.getElementById('bookingId').textContent = data.bookingId;
            document.getElementById('displayDate').textContent = data.date;
            document.getElementById('custName').value = data.custName || '';
            document.getElementById('custPhone').value = data.custPhone || '';
            document.getElementById('custAddress').value = data.custAddress || ''; // Restore Address
            document.getElementById('startTime').value = data.startTime || '';
            document.getElementById('endTime').value = data.endTime || '';
            document.getElementById('startKm').value = data.startKm || '';
            document.getElementById('endKm').value = data.endKm || '';
            document.getElementById('useReadingKm').value = data.useReadingKm || ''; // Restore Reading Km
            document.getElementById('useClosingTime').value = data.useClosingTime || ''; // Restore Closing Time
            document.getElementById('remarks').value = data.remarks || '';
            
            // Restore signature
            if (data.signature) {
                const img = new Image();
                img.onload = function() {
                    ctx.drawImage(img, 0, 0);
                };
                img.src = data.signature;
            }
        }

        // --- AUTO-SAVE SETUP ---
        function setupAutoSave() {
            const inputs = document.querySelectorAll('input, textarea');
            
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    clearTimeout(autoSaveTimeout);
                    autoSaveTimeout = setTimeout(saveBookingData, 1000); // Save 1 second after typing stops
                });
            });
        }

        // --- SHOW RESTORE NOTIFICATION ---
        function showRestoreNotification() {
            const badge = document.getElementById('statusBadge');
            badge.classList.add('active');
            setTimeout(() => {
                badge.classList.remove('active');
            }, 3000);
        }

        // --- SIGNATURE ENGINE ---
        function setupCanvas() {
            canvas = document.getElementById("sig-canvas");
            ctx = canvas.getContext("2d");
            
            new ResizeObserver(() => {
                const rect = canvas.getBoundingClientRect();
                if (canvas.width !== rect.width || canvas.height !== rect.height) {
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    canvas.width = rect.width;
                    canvas.height = rect.height;
                    ctx.putImageData(imgData, 0, 0);
                    ctx.lineWidth = 2;
                    ctx.lineJoin = 'round';
                    ctx.lineCap = 'round';
                    ctx.strokeStyle = '#000';
                }
            }).observe(canvas.parentElement);

            ['mousedown', 'touchstart'].forEach(e => 
                canvas.addEventListener(e, startDraw, {passive: false}));
            ['mouseup', 'touchend'].forEach(e => 
                canvas.addEventListener(e, endDraw, {passive: false}));
            ['mousemove', 'touchmove'].forEach(e => 
                canvas.addEventListener(e, draw, {passive: false}));
        }

        function startDraw(e) {
            writingMode = true;
            ctx.beginPath();
            const pos = getPos(e);
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function endDraw() { 
            writingMode = false;
            saveBookingData(); // Save signature immediately after drawing
        }

        function draw(e) {
            if (!writingMode) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            e.preventDefault();
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        document.getElementById('clear-sig').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            saveBookingData();
        });

        // --- PDF GENERATION ---
        function generatePDF() {
            const element = document.getElementById('printable-area');
            const bookingId = document.getElementById('bookingId').textContent;

            const opt = {
                margin:       0,
                filename:     `LogSheet_${bookingId}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
                pagebreak:    { mode: 'css' }, 
                jsPDF:        { unit: 'pt', format: 'a4', orientation: 'portrait' }
            };

            const originalStyle = element.style.cssText;
            element.style.width = "794px";
            element.style.height = "auto";
            element.style.margin = "0 auto";
            element.style.boxShadow = "none";

            html2pdf().set(opt).from(element).save().then(() => {
                element.style.cssText = originalStyle;
            });
        }
    </script>
</body>
</html>
